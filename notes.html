<script>
const COLLECTIONS = [
  {k:'lucky', label:'times i felt really, really lucky', special:true},

];
const ESSAYS = [{"t":"beef curry","d":"2025-12-15","c":"","l":false,"p":["here’s a funny story. after i started university i began to grow this level of distrust around my parents cooking. not because it wasn’t good, if anything, that was the problem. for some context i grew up in a joint-household, living with my uncle’s family. my grandmother also lived with us and because she was bed-bound for the last few years of her life, most family gatherings ended up happening at our place. given the fact that my dad had 8 siblings, and 5 of them lived nearby, we would often have some pretty big family gatherings. combine that with my dads cousins, who were also a sibling set of about 5, each with their own families, and gatherings of 50 to 60+ were a pretty normal occurrence in my house. this is all to say there was always a lot of food going around my house. and it was all insanely good, rich, and indulgent. and for most of my life i didn’t think twice about this. i just showed up and there was always something good in the fridge. plates refilled themselves. that is, until i started university. and while at first i absolutely despised the food at university, i slowly began to realize something else was happening. that eating food that was lighter, less oily, left me feeling better, more awake. more in control of my body. this was of course huge. this really started to hit when i realized the reason why i used to always feel so tired at home was because of the many carb-heavy and generally rich dishes i was eating. to be fair, there were most definitely other options. there were lighter, vegetable-heavy or fish-based dishes that were definitely healthy, but unfortunately by that point i started to just generalize it all. anything home cooked could not have been good for me. after that, whenever i came home i chose to instead eat the “healthy” foods that i learned to eat at university. the salads, the smoothie bowls, the baked chicken, you know the drill. i remember coming home a few times and even being annoyed at my parents when there was nothing “healthy” in the fridge to eat, even though there were at least 5 to 6 incredible dishes at any one time that i could choose from. i know, what a privileged take. something changed recently though. tonight, for the first time in two and a half years returning back after the end of the semester, i ate my family’s beef curry. late at night too, which would’ve been unthinkable for me a year ago. i did this, partly because i couldn’t help myself. but also partly because i know that in two weeks, i’ll be gone for four months, and then there won’t be any home cooked meals for a while. the beef curry in question. growing up in a big family everything was cooked in these huge pots. and sure, i’ll eat well in singapore. i know that. but i also know none of it will taste like this, not because it’s better, but because it belongs to a place and a time that doesn’t travel with me. and somewhere in all of this i’m also slowly coming to the realization that i’ve spent about 90% of the time i will ever spend with my parents already. not talking about the big moments. but the ones where im just sitting at a table having dinner with them, or the late night conversations i’d end up getting into with my mom. the ones that usually started with me going to the kitchen for dinner, but ended with us talking late into the night. so sure, maybe next time i eat another of my mom’s beef curries, i’ll feel a little groggier in the morning. but i think i’ve got a whole life ahead of me to eat salads. for now, i’ll enjoy all the beef curry i can get, while i still can."]},{"t":"Defining 2025: Belief Capital","d":"2025-12-21","c":"","l":false,"p":["Belief capital is the idea that people are capable of far more than they realize, and that sometimes all it takes is someone else believing in them to bring what’s possible within reach. A friend and mentor introduced me to this term just yesterday, but in many ways, I think it best encapsulates my 2025. 2025 was the year that more people put their belief behind me than ever before. At nearly every step of the way, through every new thing I tried, they pushed me to go one step further than I would have thought possible for myself. Not because they were trying to get something out of me, but because they were so confident that there was more in me, and that all it would take on their part was sharing a little bit of that belief. Often, the people providing me with this belief were people I had just met. A guy I met at a random event who got me to post my first ever social media post, or a girl who made sure I applied for a competitive program after meeting me only hours before. None of these were deep, long-standing relationships, just moments where someone saw something in me and treated it as obvious. Other times, the belief came from people I’ve known for years. Friends and mentors who know me better than I know myself. Their belief showed up differently. It was often quieter, but more precise. They knew exactly when to push me, when not to let me retreat, and reminded me of who I already was. This was the belief that helped sustain the momentum and energy I had gained throughout 2025. What I’ve realized is that belief capital works best when it’s specific. Not the generic encouragement you get from social media, but belief grounded in real understanding. The kind that comes from sensing something deeper in a person. Recognizing when their ability and their self perception are out of balance, and knowing that all they need is a small, well timed push to help them move forward. Eventually, I started offering that same belief to the people around me. What I’ve learned is that there’s something about this kind of belief that naturally multiplies. Once you experience it, you want to start offering it to everyone around you. Many of these moments took place late at night or in long, unplanned conversations after events, where everyone had emptied out, the pressure had lifted, and we could just be. It was in those conversations that I saw how little it takes to shift how someone sees themselves, and just how much impact these impromptu moments can have. 2025 taught me that we all have it within us. Sometimes all it takes is a small amount of belief for everything to change."]},{"t":"libraries","d":"2025-11-12","c":"","l":false,"p":["Growing up, my favorite place in the world was the library.","Specifically, this one located in probably the most Scarborough plaza to have ever existed. One perk of this was the insane samosa deal at the bakery nearby, something like 4 for a dollar. When we got to the library, my siblings would run off to play Animal Jam on the computers since we didn’t have one at home. Me on the other hand, I was aggressively browsing through the shelves to see if there was a new Geronimo Stilton book or literally any Rick Riordan book (shout out Percy Jackson). I very much took advantage of the library’s generous loan policy of fifty books. I unfortunately probably could not count on one hand the number of times my backpack ended up ripping from all the books I was trying to fit in.","It got so bad my parents had to get me a backpack with wheels, only for that one to rip too. Now, finally in my twentieth year of life, there aren’t a lot of possessions I haven’t lost or thrown out over the years. But my library card, that one’s still in my wallet wherever I go. If you know me personally, you know just how insane that is, given the fact that there are very, very few items I haven’t lost at least once or multiple times over the years. Visit your local library."]},{"t":"solo travel","d":"2026-01-16","c":"","l":false,"p":["I traveled solo for the first time in my life this New Year’s, spending the first eleven days of the year","It was also the first time I had ever traveled to a foreign country completely on my own, with no friends, no family, no familiar faces waiting for me when I arrived. What I imagined would be some of the most exciting days of my life instead became some of the loneliest I’ve ever experienced. As someone who gets a lot of energy from interacting with people around me, the language barrier effectively stripped much of that away. Sure, I tried using Google Translate occasionally, but conversations still felt slow and awkward. The delays broke the natural flow of communication, the kind of instant understanding you usually take for granted. And beyond that, language is about far more than words. Being unfamiliar with Japanese culture made it difficult to read the room, understand body language, or initiate non-verbal cues myself. At the same time, a part of me felt like the people around me weren’t particularly interested in what I had to say. Which I attributed largely to two things: a) I couldn’t speak the language, so engaging with me probably felt like more effort than it was worth. b) Many locals are understandably tired of tourists. Japan has a real over-tourism issue, and when some tourists show little respect for Japanese culture, it can leave a bad taste. What made all of this so much worse was the fact that I was surrounded by more people than I had ever been around in my life. Tokyo is of course one of the largest cities on this planet. When you’re used to being friendly with everyone around you, suddenly being surrounded by endless faces but not having a single person to talk to really starts to get to you. In my head, all I could think was: What the hell am I doing wrong? Statistically, this made no sense, there are millions of people here, yet I had failed to meaningfully interact with a single soul. So what changed? For starters, I got out of Tokyo. I began taking day trips because I couldn’t handle much more of the overwhelming city. With the feeling that the only thing being acknowledged about me was the space I occupied on the subway. I also realized that during those first few days, I wasn’t really traveling for myself. I was traveling for the gram. Even though I barely posted anything, many of my decisions were driven by what I thought would look cool on the internet. I was literally by myself and still stressed about what the internet would think was impressive. I was doing the most touristy things possible and then wondering why I wasn’t connecting with Japanese people. Another realization occurred to me once I finally left the city. I realized there was no point in optimizing for the “coolest” or most impressive experience based on other people’s opinions. At the end of the day, the entire country was new to me. Everything I experienced pushed the boundaries of what I already knew, and that alone was enough.","the views I got as soon as I left the tourist spots I think the people around me sensed that shift too. When I started spending time in places that weren’t packed with tourists, people were far more willing to engage. Maybe because I wasn’t just another annoying tourist, but someone who was genuinely interested in the place and had made the active decision to seek out this small, out-of-the-way restaurant. I’m now in Singapore, and while the feelings of loneliness aren’t as intense as they were in Japan, I’m still in the process of finding my people. What I’ve realized, though, is that if I want to keep pursuing things I genuinely enjoy, I have to accept these transitional periods of discomfort. They’re part of figuring out what I actually want for myself, and who I want to surround myself with, rather than simply following what everyone else is doing."]},{"t":"what is cool","d":"2025-12-06","c":"","l":false,"p":["i used to think doing improv was really stupid. afterall, it was the butt of so many jokes in sitcoms like the office, so why would i ever participate in this thing that everyone considered uncool? and honestly, until a little while back, the people doing improv didn’t match the idea of cool that i had convinced myself mattered. and so i just wrote the whole thing off without giving it a second thought. and then i met this guy. who happened to really be into improv, but he was also one of the smartest, most charismatic people i had ever met. he also happened to be a rhodes scholar and a lecturer at harvard, which, i’ll admit, probably played a role in how highly i thought of him. he also happened to be a tour guide. again, not the craziest job ever, but he did it at such an impressive level. and as someone who worked as a tour guide one summer, this guy completely blew all of my preconceived expectations out of the water. he was genuinely extremely enthusiastic and even created his own tours of the city purely because he cared so much. then i met his girlfriend, and she put into words what i had been struggling to figure out. how could this guy who does improv and is also a tour guide still somehow be so cool? and she said, “he has this ability to make anything he does cool, simply by caring a lot about it.”","and it hit me that anything i had ever deemed uncool was only uncool because i wasn’t confident enough to make it cool. since then, i’ve spent a lot of time re-evaluating what i actually want to do versus what i was avoiding just because i was scared other people would perceive me as less than. this led to the creation of a campus-wide hide-n-seek game. but first we dressed up in suits and walked around with paper bags on our heads with mr. beast’s face on them to advertise the game.","and then i got to do possibly one of the most fun things i’ve ever done, basically living out my mrbeast x squidgame dreams. where i had people running around campus and a digital fortnite-style storm closing in on hiders, plus side quests scattered throughout. all because i decided to care and embrace the uncool thing.","turns out that the only thing that ever made something uncool was just me not caring. once i fixed that, suddenly everything was on the table and i wasn’t scared of looking stupid anymore.","subscribe!"]},{"t":"One last shot","d":"2025-11-24","c":"","l":false,"p":["Three months ago, if you had told me I’d be unhappy about leaving Queen’s to go on exchange, I would have said you were insane. To put into perspective how little I cared for Queen’s, at the end of this past summer I was seriously questioning whether I even wanted to come back to school. I had just discovered the world of startups, and a good number of my friends were dropping out or taking gap years in SF. But now all I can think about is how much I am going to miss during the four months I will be away on exchange. All of this changed because I decided to take a chance on Queen’s. Instead of assuming there was no growth left for me here, I realized that this thinking was irrational. In a school of more than 30,000 students, there had to be people who could push me to grow in the ways I wanted. After taking that leap of faith and coming back, I can happily say that I did find those people. Even more, I found an entire community that helped me dream more ambitiously than I ever have before. I think this all happened because, for the first time, I knew exactly the type of person I wanted to be around. I should note that I only figured this out after a deeply reflective summer, one where I tried many things and spent a lot of time sitting with myself to understand what I was really looking for. I now realize that it was never about Queen’s. I just never knew what I wanted, and of course I was never going to find my people if I didn’t know who I was looking for. But once I knew exactly what I wanted, I started putting out the right signals, both online and in person. I created events for the exact type of person I wanted to be around, and I attracted the people I needed. It is safe to say that in the future I will be much less likely to count a place short, especially when there are so many people I have yet to even meet. If you have been thinking about dropping out or giving up on a space, I urge you to give it one last real shot. This time, put in the effort to figure out exactly what is missing in your life and then send every possible signal to attract the right people."]},{"t":"spread the love","d":"2025-11-10","c":"","l":false,"p":["One of my favourite professors I’ve ever had passed away a couple months ago. He was loved by a lot of students and many of them even described him as the GOAT, with one RateMyProf review going as far as, I love this man, I would jump in front of a bus for him. Genuinely an icon.","Part of the reason why so many students thought of him so fondly was not just that he made class extremely entertaining but that he often led with vulnerability too. During our first few classes, he shared that he had struggled with depression in university and even failed out of his first-year calculus course. He eventually came back, earned a degree in math, and became a statistician. But it was that openness, that willingness to share his struggles, that made such a deep impression on me. As a first-year student who often doubted whether I was smart enough for university, his courage gave me courage. He would often tell us, “If I could do it, you can do it.” I took his intro to stats class, but I wasn’t the best student in first year and didn’t attend many lectures in person. It wasn’t until the end of the semester, while watching the recorded lectures, that I realized just how much warmth he radiated. I still remember one moment vividly: sitting at my desk, watching a recording, and just wanting to give him a hug after he had made another one of his self-deprecating jokes. He led with honesty, humility, and genuine care from the very beginning. After finishing watching all those lectures, I remember thinking to myself, “If I can be even one-tenth of the person this man was, I’ll consider that a success.” I’ve thought about him several times since that class and always told myself I’d send him an email to thank him for the impact he had on me. But I never did. Then about a month ago, I looked his name up to finally send that email and found his obituary instead. I’m writing this with the hope you will take away the following: If there’s someone who’s positively impacted your life in any way at all, please tell them. Life is short, and tomorrow is never guaranteed. Always let the people you love know."]},{"t":"the virtues of no","d":"2025-12-07","c":"","l":false,"p":["one of the ways that i have dramatically improved the quality of my life has been by choosing to only pursue opportunities that excite me and saying no to literally everything else. this has allowed me to experience more life in the last 6 months than i had ever thought was possible. that is, by saying no more, i have experienced more life than when i was saying yes to everything. this is counterintuitive, i know. let me explain. to start, by saying no more often, it has forced me to properly evaluate exactly why i turn something down. was it because it truly did not interest me, or was i just scared to say yes? if fear was the reason, then i took that as a sign that i absolutely should go for it. it turns out there were many, many moments and opportunities that i was scared to say yes to. but what i did start rejecting were things that i realized i had only been pursuing because i was scared to say no. an example of this was saying no to returning to a previous summer job. it was a role that i knew would not provide growth in the way i wanted, and one i would have agreed to only because i was scared that i had no other options.","what i turned down when i chose not to go back to my old summer job instead, i chose to be unemployed. at the time, this was scary as hell since i’ve been working ever since i was 13 years old when i took my first job as a paper boy. but by saying no, i was able to experience a range of new experiences over the summer that allowed me to grow in far more ways than i ever could have imagined. in particular, it taught me one of the most important lessons i will ever learn: that i am fully capable of creating opportunities for myself. even without a pre-defined structure, i am still able to build and create in a way that supports my growth and allows me to contribute real value to this world. this year, i also said no to the default social option here on campus. this meant the typical going out on friday and saturday nights. unsurprisingly, these were never the most fulfilling experiences.","so, i decided to start running my own events on campus, like hosting dinners with people i thought were cool and wanted an excuse to actually get to know. this fortunately fed my soul in a way the usual routine never did.","now, at this current point in time, what i’m trying to figure out is what i want to do next summer. i know that i want an experience that pushes me to grow the same way last summer did, but i am unsure about the exact direction (whether this comes through an internship or something more entrepreneurial). what i do know is that i am not going to settle for the default path. i will keep saying no until an opportunity that genuinely excites me appears. and when it does, i will run towards it. subscribe!"]},{"t":"in pursuit of greatness","d":"2025-11-29","c":"","l":false,"p":["“im in pursuit of greatness and i know people don’t usually talk like that, but i want to be one of the greats.”","funny enough, i knew very little about timothee chalamet before this, outside of the infamous snl skit with pete davidson. but the quote above changed everything. anyone who knows me knows how much ive quoted him since then. its unfortunate, but being genuine about your ambition in our society for some reason gets read as arrogance, like youre doing too much. somewhere along the way we blurred the line between ambition and arrogance. we started treating being driven and excited about your goals as if it were bragging. a line was drawn, and it was drawn wrong. and honestly its tiring living in a world where people feel like they have to fake humble themselves every step of the way. it comes off as deeply inauthentic and, its just unhelpful. i truly believe society thrives when we are loud and ambitious about our goals. it creates a culture of striving for excellence instead of doing the bare minimum. moreover, i think there are important benefits to being loud. it impacts not just how the world sees you, but how you start seeing yourself as well. when you start telling the world what youre meant for, the world starts adjusting to that version of you. say nothing, and nothing shifts. none of this is new. historically, the only time you ever saw great things happen is when a person brave enough to challenge the status quo came along. and then everything changed. in the early 1950s for instance, people genuinely believed it was impossible to break the 4 minute mile. for over a decade, experts, coaches, and even doctors claimed the human body had biological limits that made it unachievable.","then roger bannister, a medical student, came along. he knew how ridiculous that belief was and set out to prove them wrong. and he did exactly that, running a mile in 3:59.4 in 1954. within months, more runners broke the record too. this barrier that had held for over a decade disappeared the moment someone showed it could be done. this is all to say that when we start embracing this culture of pushing limits and doing great things, we can actually bring those things to life. so yeah, if it wasn’t clear already, i want to be one of the greats. i want to spend the rest of my life creating things that matter, things that last, and hopefully stand the test of time. at least until another timothee or roger comes around and the standards are reset."]},{"t":"when canadians could build: the canadian pacific railway","d":"2025-12-11","c":"","l":false,"p":["this a new series that im gonna be writing to remind myself that there was once a time when canadians could build. this is partly my way of coping with whatever construction disaster we’re living through at the moment (looking at you finch and eglinton lrt). why was it built? the pacific railway was primarily built so that we could bring BC into the confederation. at the time BC was independent and stated that it would only join if we built a railway connecting it with the rest of the country.","so that we didn’t become america. at the time the americans openly believed that the canadian west would just naturally fall into the hands of the americans, and john a macdonald saw the railway as being an essential way to prevent american expansion.","facts to help you realize just how insane of a project this was the train was built when we only had a population of 3.5 million people. thats right, we built the longest railway that had ever been constructed at the time with only 3.5 million people living in the country. for some context the states had about 40 million people at the time and our railway ended up being 1000 miles longer than theirs.","we actually had no idea what much of the pacific coast even looked like. this is because at the time much of BC’s interior had yet to be explored, so we literally decided to build a train across the country without even having an idea of what we were going to be building it through.","we built the entire railway in 4 years, all 4860 km of it in 4 YEARS. keep in mind we had to run this through the canadian shield as well as the rocky mountains. the US, which had a far easier project, still struggled to barely complete their cross country railway in under 10 years.","the impact of this train: national unity! at the time canadian patriotism was at an all time low, and many people were even emigrating out of the country. building this railway gave us a renewed sense of pride, it proved to canadians at the time that they were capable of being a unified nation.","this summer i got to experience the train all the way from vancouver to toronto, and all i could think about was just how unbelievable this project really was. unless you’ve actually ridden the train, it’s almost impossible to understand how many ridiculous downright impossible places the route has to cross just to make its way across the country. if you ever get the chance, i’d highly recommend taking it, especially if another discount like the canada strong pass comes around. that pass actually let me do the entire trip for about $1000, food included, with an actual bed to sleep on. here are some pictures:","i hope this serves as a reminder that there was a time when we took on impossible projects and actually pulled them off, and that if we could do it once we can ABSOLUTELY DO IT AGAIN!"]}];
// EDIT: your own list of lucky moments. each = { t:'title', d:'optional date', note:'optional one line' }
const LUCKY = [];
const labelOf = k => (COLLECTIONS.find(c=>c.k===k)||{}).label || k;
const side = document.getElementById('side'), main = document.getElementById('main');
let current = 'all';

function inCollection(k){
  if(k==='all') return ESSAYS.map((e,i)=>({e,i}));
  if(k==='lucky') return ESSAYS.map((e,i)=>({e,i})).filter(x=>x.e.l);
  return ESSAYS.map((e,i)=>({e,i})).filter(x=>x.e.c===k);
}
function byNewest(a,b){ return a.e.d<b.e.d?1:-1; }

function renderSide(){
  side.innerHTML='';
  // special
  const sp = COLLECTIONS.find(c=>c.special);
  const a1=document.createElement('div'); a1.className='item lucky'; a1.textContent=sp.label; a1.dataset.k=sp.k;
  a1.onclick=()=>showCollection('lucky'); side.appendChild(a1);
  const gap=document.createElement('div'); gap.style.height='18px'; side.appendChild(gap);
  // shelves (only if any exist)
  const shelves = COLLECTIONS.filter(c=>!c.special && !c.archive);
  if(shelves.length){
    const g=document.createElement('div'); g.className='grp';
    const h=document.createElement('div'); h.className='grp-h'; h.textContent='collections'; g.appendChild(h);
    shelves.forEach(c=>{
      const it=document.createElement('div'); it.className='item'; it.textContent=c.label; it.dataset.k=c.k;
      it.onclick=()=>showCollection(c.k); g.appendChild(it);
    });
    side.appendChild(g);
  }
  // archive
  const g2=document.createElement('div'); g2.className='grp';
  const arch=COLLECTIONS.find(c=>c.archive);
  const it=document.createElement('div'); it.className='item'; it.textContent=arch.label; it.dataset.k='all';
  it.onclick=()=>showCollection('all'); g2.appendChild(it);
  side.appendChild(g2);
  markActive();
}
function markActive(){
  side.querySelectorAll('.item').forEach(el=>el.classList.toggle('active', el.dataset.k===current));
}
function showCollection(k){
  current=k; markActive();
  if(k==='lucky'){
    main.innerHTML='';
    const ct=document.createElement('div'); ct.className='col-title'; ct.textContent='times i felt really, really lucky'; main.appendChild(ct);
    if(LUCKY.length){
      const list=document.createElement('div'); list.className='list';
      LUCKY.forEach(x=>{
        const row=document.createElement('div'); row.className='row';
        const t=document.createElement('div'); t.className='rt'; t.textContent=x.t; row.appendChild(t);
        if(x.d){ const m=document.createElement('div'); m.className='rmeta'; m.textContent=fmtDate(x.d); row.appendChild(m); }
        if(x.note){ const s=document.createElement('div'); s.className='rsnip'; s.textContent=x.note; row.appendChild(s); }
        list.appendChild(row);
      });
      main.appendChild(list);
    }
    window.scrollTo(0,0); return;
  }
  const items = k==='all' ? inCollection(k) : inCollection(k).sort(byNewest);
  main.innerHTML='';
  if(k==='all'){
    const intro=document.createElement('p'); intro.className='intro';
    intro.textContent='a small collection of short essays — written to think better.';
    main.appendChild(intro);
  }
  const ct=document.createElement('div'); ct.className='col-title'; ct.textContent=labelOf(k)+' · '+items.length; main.appendChild(ct);
  const list=document.createElement('div'); list.className='list';
  items.forEach(({e,i})=>{
    const row=document.createElement('div'); row.className='row'; row.onclick=()=>showEssay(i);
    const t=document.createElement('div'); t.className='rt'; t.textContent=e.t; row.appendChild(t);
    const m=document.createElement('div'); m.className='rmeta'; m.textContent=fmtDate(e.d); row.appendChild(m);
    const s=document.createElement('div'); s.className='rsnip'; s.textContent=(e.p[0]||'').slice(0,120)+((e.p[0]||'').length>120?'…':''); row.appendChild(s);
    list.appendChild(row);
  });
  main.appendChild(list);
  window.scrollTo(0,0);
}
function showEssay(i){
  const e=ESSAYS[i];
  main.innerHTML='';
  const back=document.createElement('div'); back.className='back'; back.textContent='← '+labelOf(current);
  back.onclick=()=>showCollection(current); main.appendChild(back);
  const r=document.createElement('div'); r.className='reader';
  const h=document.createElement('h1'); h.textContent=e.t; r.appendChild(h);
  const m=document.createElement('div'); m.className='meta'; m.textContent=fmtDate(e.d) + (e.l?'  ·  ✦ one of the lucky ones':''); r.appendChild(m);
  e.p.forEach(par=>{ const p=document.createElement('p'); p.textContent=par; r.appendChild(p); });
  main.appendChild(r);
  window.scrollTo(0,0);
}
function fmtDate(s){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); if(!m) return s||'';
  const mo=['january','february','march','april','may','june','july','august','september','october','november','december'];
  return mo[(+m[2])-1]+' '+(+m[3])+', '+m[1];
}
renderSide();
showCollection('all');
</script>
</body>
</html>
