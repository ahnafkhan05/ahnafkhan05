pushed me to go one step further than I would have thought possible for myself. Not because they were trying to get something out of me, but because they were so confident that there was more in me, and that all it would take on their part was sharing a little bit of that belief. Often, the people providing me with this belief were people I had just met. A guy I met at a random event who got me to post my first ever social media post, or a girl who made sure I applied for a competitive program after meeting me only hours before. None of these were deep, long-standing relationships, just moments where someone saw something in me and treated it as obvious. Other times, the belief came from people I’ve known for years. Friends and mentors who know me better than I know myself. Their belief showed up differently. It was often quieter, but more precise. They knew exactly when to push me, when not to let me retreat, and reminded me of who I already was. This was the belief that helped sustain the momentum and energy I had gained throughout 2025. What I’ve realized is that belief capital works best when it’s specific. Not the generic encouragement you get from social media, but belief grounded in real understanding. The kind that comes from sensing something deeper in a person. Recognizing when their ability and their self perception are out of balance, and knowing that all they need is a small, well timed push to help them move forward. Eventually, I started offering that same belief to the people around me. What I’ve learned is that there’s something about this kind of belief that naturally multiplies. Once you experience it, you want to start offering it to everyone around you. Many of these moments took place late at night or in long, unplanned conversations after events, where everyone had emptied out, the pressure had lifted, and we could just be. It was in those conversations that I saw how little it takes to shift how someone sees themselves, and just how much impact these impromptu moments can have. 2025 taught me that we all have it within us. Sometimes all it takes is a small amount of belief for everything to change."]},{"t":"why the only thing you can say after 5 years of french is est-ce que je peux aller aux","d":"2025-12-29","c":"takes","l":false,"p":["in the summer between grade 12 and my first year of university, i spent 5 weeks in the middle of no-where nova scotia at Université Sainte-Anne. a university so remote that i genuinely couldn’t figure out what city it was in until i got there (google maps was saying 5 different things and was of no help). it turns out the municipality was called Clare, a village of about 8000 people, sparsely spread across the area. regardless of how small this place was, those 5 weeks taught me more french than i had learned throughout my entire school career. which admittedly is not saying a lot given, like many of you, i could really only conjugate the verb être in the past and present tense, ask to go to the washroom, and name a couple other random nouns too. but by the end of those 5 weeks, i got to a level where i could comfortably have conversations about most things for hours on end. so how did i go from knowing very little french to being able to speak it so comfortably? lets start from the very beginning. language learning here in ontario (also likely applicable to other provinces in canada as well the states) is deeply, deeply flawed. first off, in what world does a person start by learning the past and present tense of a word without ever actually speaking a single word out loud. if you think about it, the way the human brain picks up languages is by learning some basic words first and then putting them together into sentences. and from there mostly just getting better at imitating how the people around us speak. a good way to think about this is by looking at how toddlers speak. a toddler might point to an apple and say “eat apple” instead of “can you hand me that apple.” and that is perfectly fine, because we all understand what the toddler is trying to say. now imagine instead of handing the toddler the apple, you gave the kid a lesson on using the correct verbs and conjugation of être. not only would that toddler be overwhelmed and confused, but they’d likely be too traumatized from speaking again because every time they try to say something, someone’s tryna teach them a grammar lesson. so instead of prioritizing grammar in schools, what we should’ve been doing is getting people to speak the language as much as possible. unfortunately, at least in the schools i grew up going to, this was what they seemed to be worst at. in fact, the only french we’d usually end up speaking were some extremely rehearsed presentations about pizza toppings or something like that. everything else was pretty one-way, with the teacher mostly speaking at you, which unfortunately wasn’t done very well either. usually it ended in them having to translate into english because they spoke french as if we were people who had been speaking the language our whole lives. when they should’ve speaking to us more like toddlers, using basic sentences so we could actually understand and maybe even have created an environment where we could speak french to one another. that failure is exactly what made the 5-week program feel so different. there, speaking was prioritized over everything else. in fact, the teachers took this so seriously that they didn’t even let us use the ontario school cheat code of asking comment dit-on blank (translation: how do i say this english word). instead, they forced us to literally mime out the words. and because of those occasionally humiliating experiences, you best believe we never forgot how to say the word once we eventually figured it out. fun story, they took speaking french so seriously that they introduced a 3 strike system. it was so strictly enforced that i got my first advertisement (warning) for speaking english in the middle of the night with some friends during my first week there. it took place at a gazebo they had, technically off campus, in a nearby field. you can imagine how frightened me and my peers were when two of the program assistants appeared out of nowhere in the dark to issue us a warning.","the gazebo in question after that, you would not find me speaking english anywhere out of fear of being issued another advertisement. because if they could enforce the rules in the middle of the night at a random gazebo, i wasn’t willing to try my luck elsewhere. all of the french speaking did pay off, though, which i think was in large part due to the fact that i really did try speak it as much as possible. which honestly wasn’t that hard, since if you know me well, you know that shutting up has never been one of my strong suits. where some of my peers were content being able to communicate slightly less than they usually would, the language barrier was not enough to stop all my yapping. so for the rest of the five weeks, i spoke some really crappy french until it wasn’t so crappy anymore and i could communicate almost as well as i would’ve been able to in english. lesson of the story: like almost everything else in life, the best way to learn a language is by actually doing. in this case, that means speaking instead of worrying about grammar. you’ll figure the rest out eventually, but you’ll never learn to speak if you don’t start talking. finally, for those of you who are curious, i did this program through a federally funded program called explore canada. it is now known as the official languages program, but still offers a fully funded 5 week trip, including housing, food, and tuition within a french speaking community in canada. the program is run through local universities, and at the end you are awarded credits equivalent to completing 2 classes at most universities. its absolutely an experience i’d recommend to anyone looking to learn french, and easily the fastest way to pick up the language. also here’s some kind of shakey drone footage i was also able to capture of the Université Sainte-Anne campus which was actually quite beautiful."]},{"t":"wrapping up 2025","d":"2026-01-01","c":"self","l":false,"p":["in 2025 i bet on myself. in doing so i’ve accomplished more than i ever thought was possible at the beginning of the year. somethings i’m proud of from 2025 most intentional i’ve ever been with my time. realized i was 20 years old now and that time goes by too quickly. started saying no to a lot more stuff and prioritized stuff i actually wanted and not what i was “supposed” to be doing.","put myself out there more than i have ever before in my life including posting for the first time ever on instagram!(like first ever personal post too LOL)","got back into reading stopped using my phone before bed and suddenly i started to read books again. this has effectively reversed the deterioration of my brain from years of scrolling.","prioritized good conversation i reached out to so many people i thought were cool but had always been too nervous to contact. as a result, i’ve met more of my people this year than i ever have in past years.","2026 goals less thinking more doing. still a major roadblock for me. case in point: this post should’ve been written much earlier. but i wasn’t sure how i was gonna write a post summarizing all of 2025 and so i procrastinated instead.","substack goals: i’m gonna be on exchange for the next semester(currently writing this from a capsule hotel room in tokyo!). i wanna document this as much as possible, even if its just the little things that i notice. expect to see shorter but more consistent posts going forward.","tokyo!"]},{"t":"solo travel","d":"2026-01-16","c":"places","l":true,"p":["I traveled solo for the first time in my life this New Year’s, spending the first eleven days of the year","It was also the first time I had ever traveled to a foreign country completely on my own, with no friends, no family, no familiar faces waiting for me when I arrived. What I imagined would be some of the most exciting days of my life instead became some of the loneliest I’ve ever experienced. As someone who gets a lot of energy from interacting with people around me, the language barrier effectively stripped much of that away. Sure, I tried using Google Translate occasionally, but conversations still felt slow and awkward. The delays broke the natural flow of communication, the kind of instant understanding you usually take for granted. And beyond that, language is about far more than words. Being unfamiliar with Japanese culture made it difficult to read the room, understand body language, or initiate non-verbal cues myself. At the same time, a part of me felt like the people around me weren’t particularly interested in what I had to say. Which I attributed largely to two things: a) I couldn’t speak the language, so engaging with me probably felt like more effort than it was worth. b) Many locals are understandably tired of tourists. Japan has a real over-tourism issue, and when some tourists show little respect for Japanese culture, it can leave a bad taste. What made all of this so much worse was the fact that I was surrounded by more people than I had ever been around in my life. Tokyo is of course one of the largest cities on this planet. When you’re used to being friendly with everyone around you, suddenly being surrounded by endless faces but not having a single person to talk to really starts to get to you. In my head, all I could think was: What the hell am I doing wrong? Statistically, this made no sense, there are millions of people here, yet I had failed to meaningfully interact with a single soul. So what changed? For starters, I got out of Tokyo. I began taking day trips because I couldn’t handle much more of the overwhelming city. With the feeling that the only thing being acknowledged about me was the space I occupied on the subway. I also realized that during those first few days, I wasn’t really traveling for myself. I was traveling for the gram. Even though I barely posted anything, many of my decisions were driven by what I thought would look cool on the internet. I was literally by myself and still stressed about what the internet would think was impressive. I was doing the most touristy things possible and then wondering why I wasn’t connecting with Japanese people. Another realization occurred to me once I finally left the city. I realized there was no point in optimizing for the “coolest” or most impressive experience based on other people’s opinions. At the end of the day, the entire country was new to me. Everything I experienced pushed the boundaries of what I already knew, and that alone was enough.","the views I got as soon as I left the tourist spots I think the people around me sensed that shift too. When I started spending time in places that weren’t packed with tourists, people were far more willing to engage. Maybe because I wasn’t just another annoying tourist, but someone who was genuinely interested in the place and had made the active decision to seek out this small, out-of-the-way restaurant. I’m now in Singapore, and while the feelings of loneliness aren’t as intense as they were in Japan, I’m still in the process of finding my people. What I’ve realized, though, is that if I want to keep pursuing things I genuinely enjoy, I have to accept these transitional periods of discomfort. They’re part of figuring out what I actually want for myself, and who I want to surround myself with, rather than simply following what everyone else is doing."]}];
const labelOf = k => (COLLECTIONS.find(c=>c.k===k)||{}).label || k;
const side = document.getElementById('side'), main = document.getElementById('main');
let current = 'all';

function inCollection(k){
  if(k==='all') return ESSAYS.map((e,i)=>({e,i}));
  if(k==='lucky') return ESSAYS.map((e,i)=>({e,i})).filter(x=>x.e.l);
  return ESSAYS.map((e,i)=>({e,i})).filter(x=>x.e.c===k);
}
function byNewest(a,b){ return a.e.d<b.e.d?1:-1; }

function renderSide(){
  side.innerHTML='';
  // special
  const sp = COLLECTIONS.find(c=>c.special);
  const a1=document.createElement('div'); a1.className='item lucky'; a1.textContent=sp.label; a1.dataset.k=sp.k;
  a1.onclick=()=>showCollection('lucky'); side.appendChild(a1);
  const gap=document.createElement('div'); gap.style.height='18px'; side.appendChild(gap);
  // collections
  const g=document.createElement('div'); g.className='grp';
  const h=document.createElement('div'); h.className='grp-h'; h.textContent='collections'; g.appendChild(h);
  COLLECTIONS.filter(c=>!c.special && !c.archive).forEach(c=>{
    const it=document.createElement('div'); it.className='item'; it.textContent=c.label; it.dataset.k=c.k;
    it.onclick=()=>showCollection(c.k); g.appendChild(it);
  });
  side.appendChild(g);
  // archive
  const g2=document.createElement('div'); g2.className='grp';
  const arch=COLLECTIONS.find(c=>c.archive);
  const it=document.createElement('div'); it.className='item'; it.textContent=arch.label; it.dataset.k='all';
  it.onclick=()=>showCollection('all'); g2.appendChild(it);
  side.appendChild(g2);
  markActive();
}
function markActive(){
  side.querySelectorAll('.item').forEach(el=>el.classList.toggle('active', el.dataset.k===current));
}
function showCollection(k){
  current=k; markActive();
  const items = inCollection(k).sort(byNewest);
  main.innerHTML='';
  if(k==='all'){
    const intro=document.createElement('p'); intro.className='intro';
    intro.textContent='a running collection of short essays — written to think better. pick a shelf on the left, or browse everything below.';
    main.appendChild(intro);
  }
  const ct=document.createElement('div'); ct.className='col-title'; ct.textContent=labelOf(k)+' · '+items.length; main.appendChild(ct);
  const list=document.createElement('div'); list.className='list';
  items.forEach(({e,i})=>{
    const row=document.createElement('div'); row.className='row'; row.onclick=()=>showEssay(i);
    const t=document.createElement('div'); t.className='rt'; t.textContent=e.t; row.appendChild(t);
    const m=document.createElement('div'); m.className='rmeta'; m.textContent=e.d; row.appendChild(m);
    const s=document.createElement('div'); s.className='rsnip'; s.textContent=(e.p[0]||'').slice(0,120)+((e.p[0]||'').length>120?'…':''); row.appendChild(s);
    list.appendChild(row);
  });
  main.appendChild(list);
  window.scrollTo(0,0);
}
function showEssay(i){
  const e=ESSAYS[i];
  main.innerHTML='';
  const back=document.createElement('div'); back.className='back'; back.textContent='← '+labelOf(current);
  back.onclick=()=>showCollection(current); main.appendChild(back);
  const r=document.createElement('div'); r.className='reader';
  const h=document.createElement('h1'); h.textContent=e.t; r.appendChild(h);
  const m=document.createElement('div'); m.className='meta'; m.textContent=e.d + (e.l?'  ·  ✦ one of the lucky ones':''); r.appendChild(m);
  e.p.forEach(par=>{ const p=document.createElement('p'); p.textContent=par; r.appendChild(p); });
  main.appendChild(r);
  window.scrollTo(0,0);
}
renderSide();
showCollection('all');
</script>
