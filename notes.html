];
const ESSAYS = [{"t":"you should share more music with your friends","d":"2025-11-06","c":"how","l":false,"p":["if you’ve been meaning to reconnect with an old friend, or literally just bother the same old one, i would highly recommend sending them a song. the thing about music is that it gets you to feel feelings your body could literally not unlock any other way. probably why people have been using music to elevate their souls for basically as long as humanity has existed. and here’s the thing, you can also take part in that elevation just by sending a friend a song. there’s something insanely intimate about someone knowing you well enough to send you a song they think you’d like. cause wdym you thought of me when you heard this? all the people on this planet and you thought of me??? there’s this idea that to be loved is to be seen. and you try to tell me if there’s anything that makes someone feel more ‘seen’ than knowing what makes their brain tick. a friend of mine recently shared that whenever he meets someone new, he asks them for their favorite song. and while i realize that isn’t the most insane question you could ask someone, it’s just something i don’t think we really do anymore (which i mostly credit to shitty icebreakers that have made it odd for us to ask each other random questions). knowing someone’s favorite song is knowing what makes their brain tick. it lets you understand them in a way that can really only be communicated through music. it’s like that one video where two ai agents are communicating with one another and suddenly start speaking in a series of beeps and boops, a language only they can understand. similarly, listening to someone’s favorite song lets you understand them in a way that you could probably not put into words, but you understand nonetheless. anyways, send your friend a song for me. and next time you meet someone, maybe ask them their favorite song too.","oh, and here are three songs i’ve been listening to that you might also like:","lots of love, ahnaf"]},{"t":"The name is Mamdani, M-A-M-D-A-N-I","d":"2025-11-07","c":"takes","l":false,"p":["A South Asian, pro-Palestinian, democratic socialist man just won in a city with one of the largest Jewish populations outside Israel, and in a city that could be described as the embodiment of capitalism. Millions of dollars were spent by billionaires trying to make sure this didn’t happen, and he STILL won. The youngest mayor we’ve seen in over a century. How did he do it? Well, for starters, he actually reached out to men. He engaged with the “manosphere”, actually going on podcasts with people like Andrew Schultz. One of the Democrats’ biggest mistakes in the last presidential election was their failure to engage with the podcast bros. Case in point: The most famous person Kamala went on a podcast with was Alex Cooper from Call Her Daddy. The most famous person Trump went on with was Joe Rogan. 1 vs 60 MILLION views. The idea that the podcast bros were never willing to engage has always been pretty bullshit. For God’s sake, Joe Rogan supported Bernie in 2016. The truth is, the old-guard Democrats didn’t avoid that crowd because it was a waste of time. It’s because they couldn’t give them what they wanted, which was a change in the status quo. Because at the end of the day, they never really cared to challenge it. I mean, how could they? The status quo was mostly them. Whether or not the Democrats want to believe it, the manosphere is currently hugely representative of what many men and the general population feel: a need for radical change after years of being severely pushed out of the middle class. But the Democrats couldn’t promise them that. Meanwhile, Trump gave them radical change, not the kind many of us would agree with, but radical change nonetheless. Now Mamdani is running the same playbook, appealing to that same hunger for radical change. Hopefully this is a lesson for the Democrats, and for anyone who claims to speak for progressives. You must make a decision. You can embrace radical change, like the Republicans did with Trump, or you can keep chasing the “centrists” and fade into irrelevance."]},{"t":"you should probably be charging for your events","d":"2025-11-08","c":"building","l":false,"p":["One of the biggest unlocks I’ve had from running events was starting to charge for them. Unfortunately, as a student, paid events are rare, so most people feel pretty uncomfortable charging for experiences, especially for events that are usually free, like hackathons or even more casual socials. But there are a number of benefits to charging. Increased attendance rate. Free events have a no-show rate of around 50% on average. Add the friction of paying, even a small amount, and that rate can drop to less than 20% and even 10% if you include an application process.","Spend less time on sponsorships. The amount of time you spend trying to find sponsors could be better spent improving your event. You also gain much more creative freedom when you don’t have to rely on sponsors.","Charging creates a self-fulfilling expectation. When people pay, you’ll naturally want to make the experience worthwhile for them. Because charging will feel uncomfortable the first few times, you’ll keep trying to raise the bar for yourself, justifying people paying.","Positive psychological effects of paying. When people pay money, they tend to rationalize the cost by assuming they’re getting good value in return. Of course, if they come to your events, very little mental work will be needed because your event will obviously be worth every dollar.","People value highly curated experiences. In the real world, it’s rare to find a room where everyone’s cool and chill unless it’s already part of some sort of exclusive group. A guarantee of cool new people to meet is something that most people value pretty highly.","Paying for experiences is actually pretty normal. Nightclubs and other “curated” experiences regularly charge insane amounts for literally just music in the background.","Hopefully, these reasons give you the courage to rip that band-aid off and start charging some money for your events."]},{"t":"take more breaks","d":"2025-11-09","c":"how","l":false,"p":["one of the most counterintuitive things i’ve learned is that working more doesn’t always mean getting more done. sometimes taking short breaks can actually improve your work by giving your brain a chance to reset. it also creates space for those moments of clarity that only show up when you let your mind rest. what i like to do is start with shorter work blocks of 30–45 minutes and gradually ramp up to longer sessions of 75–90 minutes. once my brain starts feeling tired, i ramp back down. this entire cycle usually lasts about four hours, and i’m usually able to fit in around four or five solid work blocks. importantly, not all breaks are good breaks. for most people, doing something highly stimulating(like doom scrolling) during breaks won’t leave you feeling refreshed. here are some things you should do instead: drink some water","go for a walk","stare at a blank wall (resets dopamine)"]},{"t":"spread the love","d":"2025-11-10","c":"how","l":false,"p":["One of my favourite professors I’ve ever had passed away a couple months ago. He was loved by a lot of students and many of them even described him as the GOAT, with one RateMyProf review going as far as, I love this man, I would jump in front of a bus for him. Genuinely an icon.","Part of the reason why so many students thought of him so fondly was not just that he made class extremely entertaining but that he often led with vulnerability too. During our first few classes, he shared that he had struggled with depression in university and even failed out of his first-year calculus course. He eventually came back, earned a degree in math, and became a statistician. But it was that openness, that willingness to share his struggles, that made such a deep impression on me. As a first-year student who often doubted whether I was smart enough for university, his courage gave me courage. He would often tell us, “If I could do it, you can do it.” I took his intro to stats class, but I wasn’t the best student in first year and didn’t attend many lectures in person. It wasn’t until the end of the semester, while watching the recorded lectures, that I realized just how much warmth he radiated. I still remember one moment vividly: sitting at my desk, watching a recording, and just wanting to give him a hug after he had made another one of his self-deprecating jokes. He led with honesty, humility, and genuine care from the very beginning. After finishing watching all those lectures, I remember thinking to myself, “If I can be even one-tenth of the person this man was, I’ll consider that a success.” I’ve thought about him several times since that class and always told myself I’d send him an email to thank him for the impact he had on me. But I never did. Then about a month ago, I looked his name up to finally send that email and found his obituary instead. I’m writing this with the hope you will take away the following: If there’s someone who’s positively impacted your life in any way at all, please tell them. Life is short, and tomorrow is never guaranteed. Always let the people you love know. Thanks for reading! Subscribe for free to receive new posts and support my work."]},{"t":"I miss the old sneako, straight from the 'Go sneako, Chop up the soul senako, set on his","d":"2025-11-11","c":"takes","l":false,"p":["there’s this trend that i’ve noticed in a lot of people who start posting on social media. usually most people start off with good intentions, just being themselves and posting things that actually mean something to them. but as they keep posting they realize they need to play towards the algorithm and oftentimes this can mean posting stuff that isn’t really true to them. for instance as someone who spends a decent amount of time in the tech bubble side of x (twitter), i’ve seen many people start posting things purely to ragebait. in most instances, the stuff they post, like saying something weird about a girl, isn’t even how they are in real life it’s just on the internet they start playing this persona, solely to increase engagement. what i’m curious about is if there’s a point where you ragebait so much on instagram and x that people only see you as that, and even worse, you start to see yourself that way too. i think the most famous example of this is sneako. if you’ve ever watched his old stuff, you’ll know how genuine of a guy he was.","unfortunately when most people think of sneako now, they likely think of the persona he’s developed in the last few years, diving deep into the red-pill community and the manosphere. the part that’s most shocking to me is that if you look at his old videos, by all accounts, this man was one of the most emotionally mature, insightful, and wise people you could find at his age. so where did it go all wrong? i’m not sure, to be honest. i’d like to believe that most people can remain authentic, or at least stay grounded in their values, even when clout gets involved. but if someone like sneako is vulnerable to it, then who am i?"]},{"t":"libraries","d":"2025-11-12","c":"how","l":false,"p":["Growing up, my favorite place in the world was the library.","Specifically, this one located in probably the most Scarborough plaza to have ever existed. One perk of this was the insane samosa deal at the bakery nearby, something like 4 for a dollar. When we got to the library, my siblings would run off to play Animal Jam on the computers since we didn’t have one at home. Me on the other hand, I was aggressively browsing through the shelves to see if there was a new Geronimo Stilton book or literally any Rick Riordan book (shout out Percy Jackson). I very much took advantage of the library’s generous loan policy of fifty books. I unfortunately probably could not count on one hand the number of times my backpack ended up ripping from all the books I was trying to fit in.","It got so bad my parents had to get me a backpack with wheels, only for that one to rip too. Now, finally in my twentieth year of life, there aren’t a lot of possessions I haven’t lost or thrown out over the years. But my library card, that one’s still in my wallet wherever I go. If you know me personally, you know just how insane that is, given the fact that there are very, very few items I haven’t lost at least once or multiple times over the years. Visit your local library."]},{"t":"reading books","d":"2025-11-13","c":"how","l":false,"p":["If I was stranded on a desert island and could only take one item, without a doubt it would be my reading list collection (I know this is cheating since it’s not one item, but allow me please). Now I say all of this knowing that until very recently, for a solid 4 to 5 years, I literally only read one book a year. But now, in the last 2 months alone, I have read 5 books. Crazy, I know. I also know that casual reading is something a lot of people struggle with, even those who used to read aggressively as children, so I’m writing this guide to help you get out of that slump and back into the glorious glorious world of books again. So what started my reading journey? It started a couple of months ago when I was unbelievably fed up with the lack of progress in my life, so I decided to start by fixing my sleep schedule. This was actually a huge learning experience for me, and I will probably write about it in another piece, but for now all you need to know is that for 2 weeks I went to sleep at 11 pm and woke up at 7 am, no matter what. I realized very quickly that this challenge would be impossible if I had my phone anywhere near my bed, so for those 2 weeks, an hour before bed, all devices were turned off and placed far, far away from where I sleep. What this did was force me to find something else to do before bed, and suddenly I was reading again. Beyond that, I think it can also be super helpful to start with books that are actually relevant to your life. The first book I picked up when I started reading again was a book on healthy masculinity (King, Warrior, Magician, Lover), which at the time was something I was really trying to understand. Another extremely helpful tip: please throw the e-reader or any screen you read on away. First of all, if you are reading on a tablet, what are you even doing. You are going to get notified every 30 seconds, and let’s be so for real, your monkey brain definitely cannot control itself. Secondly, it is also just so much more strenuous on your eyes. You already spend most of your day on a screen, so why put your eyes through more suffering, especially for an activity that is supposed to be relaxing. Finally, this might just be a me thing, but being able to see that I am making physical progress through a book gives me such a huge sense of accomplishment. Also, speaking of physical books, if you are a university student, you should know your university library likely has access to every book to ever exist. Since most students do not read casually, the vast majority of books are available to be borrowed. Most university libraries also have loan periods of at least a couple of months, so you can take your time with the books. Hopefully you can apply some of this and get back into the beautiful world of books. ."]},{"t":"first believers","d":"2025-11-15","c":"building","l":false,"p":["a lot of success in life can be credited to having early believers. people who supported me in whatever mission i was up to and used whatever insight they had to help bring my vision to life. early on that was my parents, then it was my teachers, and now it is the mentors i’ve been lucky enough to find. i believe that everyone is capable of doing great things. however, having someone believe in you early on can heavily speed up that process, if not be the make or break for whether it actually happens. i’ve been lucky for most of my life. i’ve had many mentors and first believers who have consoled me and stood there with me through all of my ups and downs. because of all that support, i have always been able to dream bigger and bigger. but occasionally there will come that one person who shuts it all down. not someone who grounds you in a healthy way, but someone who rips you apart and tells you it is not possible. for some people this might even be their parents. for others it might be their teachers or even someone they thought was a friend. and unfortunately, if you are like me, it only takes one of those voices to bring you down on an astronomical level, especially when it comes from someone you hold some level of respect for. one comment can overshadow years of support. and no matter how much we try, we cannot control when those people show up or what they say. what we can control is the role we choose to play in other people’s lives. what i propose is that we all try our best to become more people’s first believers. at the end of the day, it only takes one person to say they believe in you. be genuine about it. do not go supporting things you don’t actually believe in. but if you see something that’s cool, let the person know. it makes all the difference when you’re starting, and even when you have been at it for a while","."]},{"t":"toronto p1","d":"2025-11-17","c":"places","l":false,"p":["perhaps the most underrated city to ever exist. toronto gets a lot of hate, including from its own people. but i think a lot of that hate is unjustified, so this article will refute some of the most commonly cited reasons to dislike toronto. 1. toronto is not a safe city. this is just not true. on a per capita basis, toronto has one of the lowest crime rates of any major city in the world. even in canada, it has a lower crime rate than the national average. this is a very rare occurrence for large cities in most countries. outside of these stats, a lot of people also point towards the ttc as being generally unsafe (which is largely a result of exaggerated media coverage). and while it’s true that there are now more people with mental health issues seeking refuge on the subway. the rates of violent crime are still incredibly low. in fact, in 2022 the ttc reported 1,068 violent incidents against passengers out of 321 million rides. that means there is about a 1 in 300,000 chance that something could happen to you on the ttc. it’s not 0, but still very, very low. 2. toronto’s transit sucks okay this one kinda has some truth to it. we have a lot to work on, and the amount of time it took to get the still-under-construction eglinton lrt is criminal. BUT toronto must get credit where credit is due. first of all, you have to take into consideration that our transit system is criminally underfunded. whereas other major cities like chicago and LA get something like $4 for every ride taken from the government, toronto only receives 90 cents per ride. our subway system, even though it’s super small, is still extremely efficient. in fact, if you add up the total ridership of cities like chicago, LA, and dallas, it still wouldn’t add up to the over 800 million rides taken on the ttc in 2024. beyond that, our bus network is also quite impressive. the fact that the ttc is able to offer 24/7 service is an insane feat, given the fact that there are many cities much larger than toronto that aren’t even able to offer this service. all of this being said, i’m not pretending toronto is perfect. there’s plenty it needs to fix, but we should acknowledge how much it accomplishes despite its limited resources."]},{"t":"what a good co-founder can do for you","d":"2025-11-18","c":"building","l":false,"p":["i think i’ve always been a pretty ambitious kid. but over the last few months i think that side of me has really come out to its fullest. and i think one of the biggest reasons for that has been finding a good co-founder that matches my ambition. i think one of the most detrimental things anybody can do to their growth is surrounding themselves with people who put them down. this can be especially bad if this person is your co-founder/co-chair/co-organizer. most of my life i used to partner up with people who i thought were more realistic than me. in my head believing that they played the important role of grounding me. i spent so much time listening to people telling me that my ideas weren’t realistic. which in retrospect i realize was stupid on my part because that time could’ve just been used to prove them wrong. i now realize that being younger, you don’t really need grounding. after all, there’s literally nothing to lose. i’m now in an extremely fortunate position where the people in my life, including my co-founders and closest friends, all push me to be the best version of myself. and now suddenly the sky is literally the limit. the only limit now is how bad we want it. moral of the story: surround yourself with people who believe in you and push you to be the best version of yourself."]},{"t":"on re-invention","d":"2025-11-19","c":"self","l":false,"p":["one of the greatest lessons i’ve learned in high school and university is you can be whoever you want, whenever you want. i think a lot of us are scared of making big changes because we don’t want to be perceived as someone we’re not. but the most insane thing i’ve observed over the last few years is that people have INSANELY short memories. in fact, the amount of kids who re-invented their entire personalities in high school is wild. some went from being known as the delinquent kid to becoming the all-star student where the only thing that mattered to them was grades. others, less common but definitely real, became complete jerks somewhere along the way. people change who they are all the time, most people really don’t care or notice. my favourite example of people having goldfish brains is our treatment of someone like trump. this man has committed so many unthinkable acts over the last few years, yet most people could not remember 90 percent of them. hell, this man got re-elected after inciting an insurrection at the white house. so yeah, if he can do it, you can absolutely do it. although in his case he didn’t really re-invent himself, people just forgot. regardless, not wanting to be perceived as trying too hard or something else should not be the reason why you aren’t becoming the best version of yourself. and also, at the end of the day, even if people did care, what does it even matter. subscribe!"]},{"t":"bobcaygeon","d":"2025-11-23","c":"places","l":true,"p":["Thanks for reading! Subscribe for free to receive new posts and support my work. on november 20th, 2025 my friend introduced me to the tragically hip. the world would never be the same again. for the last 2 days i’ve been listening to bobcaygeon on repeat. to say this song has made me emotional would be an understatement. it’s been able to draw out this immense sense of nostalgia, interacting with parts of my past that i’d only ever experienced passively. but suddenly this song exposes all of it, and now all i want is to experience this past just one more time. or it might have something to do with just how uniquely canadian this song is. the weekend trips between cottage country (bobcaygeon) and toronto.","the music video filmed in scarborough (where i also just so happen to have grown up).","the feeling of the song, wanting something more but not knowing how to get it. instead, just dealing with all the shit life throws at you. but hey, at least you’ve got bobcaygeon.","or maybe it’s the uniquely canadian wholesomeness of it all, the simple life this man is living, his job as a police officer, and the girl he looks forward to seeing on weekends.","whatever it is, i’m happy this song is ours and no one else’s. rip gord downie"]},{"t":"One last shot","d":"2025-11-24","c":"building","l":false,"p":["Three months ago, if you had told me I’d be unhappy about leaving Queen’s to go on exchange, I would have said you were insane. To put into perspective how little I cared for Queen’s, at the end of this past summer I was seriously questioning whether I even wanted to come back to school. I had just discovered the world of startups, and a good number of my friends were dropping out or taking gap years in SF. But now all I can think about is how much I am going to miss during the four months I will be away on exchange. All of this changed because I decided to take a chance on Queen’s. Instead of assuming there was no growth left for me here, I realized that this thinking was irrational. In a school of more than 30,000 students, there had to be people who could push me to grow in the ways I wanted. After taking that leap of faith and coming back, I can happily say that I did find those people. Even more, I found an entire community that helped me dream more ambitiously than I ever have before. I think this all happened because, for the first time, I knew exactly the type of person I wanted to be around. I should note that I only figured this out after a deeply reflective summer, one where I tried many things and spent a lot of time sitting with myself to understand what I was really looking for. I now realize that it was never about Queen’s. I just never knew what I wanted, and of course I was never going to find my people if I didn’t know who I was looking for. But once I knew exactly what I wanted, I started putting out the right signals, both online and in person. I created events for the exact type of person I wanted to be around, and I attracted the people I needed. It is safe to say that in the future I will be much less likely to count a place short, especially when there are so many people I have yet to even meet. If you have been thinking about dropping out or giving up on a space, I urge you to give it one last real shot. This time, put in the effort to figure out exactly what is missing in your life and then send every possible signal to attract the right people."]},{"t":"my favourite type of person","d":"2025-11-25","c":"self","l":false,"p":["there are some people who can enter a room and their energy is just everything. like a ray of sunshine or a shot of espresso, as andrew garfield would say. i’ve often struggled to put into words just what it is about them that makes them such a speal type of human, and so i’ve put some time into analyzing some common characteristics amongst all of these people. here they are: the most obvious is their positive energy. not in the aggressive way, where you try to put a positive spin on the world, but in the way where they are just generally very happy people. people who are happy and just excited to be here.","they smile… A LOT. and it’s everything. it’s this silly grin on their face that never leaves, that you can’t help but resist and eventually start smiling too.","and i know some people are self-conscious about what their smile looks like, but i truly believe people look their best when they’re smiling. there has to be some deeply biological reason for why we associate smiling with being a good thing, but nonetheless it absolutely works.","they are genuine about everything. this one is probably the hardest to put into words, but you can always tell that they are exactly who they say they are. that this is what they care about and this is what they don’t. in that way, it is so much easier to like these people because you don’t feel like you have to figure out their angle.","real interest in people. and this can only happen when you assume the best in people. so they will absolutely come with questions in good faith about who you are.","by doing all of this, they make you feel like the best version of yourself. the person who you tell yourself you are at your best moments. i don’t know what else to say other than i love people."]},{"t":"credentialism","d":"2025-11-26","c":"takes","l":false,"p":["i’d like to think that i’m a pretty competent person. unfortunatley i don’t this is usually well conveyed unless i have a 1-1 on conversation with you or you come across some of my work on the internet. what makes it worse is that the vast vast majority of people can really only judge me based off my resume and my linkedin. and even with my linkedin many people will likely not have the required context to understand exactly what it is that i was able to accomplish. and so now i’m left sitting here trying to figure out how i can convey to the majority of the world that i’m a competent person. i ended up having a long conversation about this with my mentor. and we eventually settled on the idea that ultimately, no matter what accolades i may have, that feeling of being content must come internally. i am okay with this. however, we both also acknowledged that sometimes in life it’s easier to quantify someone based off the accolades, scholarships, or crazy internships they’ve landed. i want to emphasize that i definitely think there is so much more to a person than these things. however, the accolades they do have can be easy short hands to quantify a person’s competency. it’s a lot easier to say someone is smart because they got an internship at mckinsey than it is to explain the accomplishments of someone who might not have something as recognizable on their resume. at the end of the day, everyone recognizes that landing a mckinsey internship requires you to be pretty intelligent, whereas not everyone will understand the impact or effort behind that one club you started. beyond this, i think another benefit of having something so recognizable is that when you’re talking someone up for a job or just in general, it’s a lot easier to hype them up if you can just list their universally recognized accomplishments. in that way, your reputation gets around a lot easier. unfortunately, at this point, i don’t have any crazy scholarships or internships to show off. so for the foreseeable future, i guess i’ll just have to make an amazing first impression on everyone i meet. and hopefully, i can lock in and land that one job or program acceptance so i can finally have something that backs up the work i know i’m already doing."]},{"t":"exchange","d":"2025-11-27","c":"places","l":false,"p":["in about a month’s time i’ll be heading to asia for a couple weeks in japan, afterwhich i’ll be heading to singapore for my exchange semester. believe it or not, 6 months ago i was heavily contemplating whether i should even go on exchange. this mindset for me is of course very different now. in this piece though, i’ll start off by outlining some of the main factors that pulled me towards exchange, and at a later time i’ll likely outline what was pushing me against going. before anything else, one of the biggest factors that pushed me toward going was realizing how unique of an opportunity it was to explore a place while also attending school there. in my head, school and work are really the only 2 ways you can fully immerse yourself in a space that you didn’t already grow up or live in. going to school in particular has the benefit of being surrounded by people your age, who are usually also a lot more social than the people you’d find at your average workplace. this lets you connect and interact with people in a way you can’t really do any other way. the second big reason why i decided to go to singapore and not somewhere in europe, where the vast majority of Queen’s students go, is because europe is a place i could likely travel to at pretty much any age. with most of it having very developed infrastructure, i’m not worried about being able to visit in my later years (not that i don’t plan on travelling there very soon). on top of that, knowing that i’ll likely end up working somewhere in north america when i’m older, i figure there will be plenty of work or business trips that take me to europe anyway, so i wasn’t too worried about never seeing it. singapore and south east asia, especially the south east asia part, felt like places where there was a much lower chance i’d end up visiting for work. and beyond that, motorbiking and hiking through the valleys and mountains in south east asia is the kind of experience you can lean into way more when you’re younger. ultimately i’m extremely glad i did end up deciding to go on exchange, and i’m super excited to experience whatever cool stuff i get up to."]},{"t":"snow days","d":"2025-11-28","c":"places","l":true,"p":["growing up in canada, there are few days you look more forward to than snow days. unfortunately growing up in toronto, these snow days were few and far between thanks to a pretty impressive snow removal system the city has set up.","still, the very rare times they did happen you absolutely took advantage of it. pictured above you’ll see a very young me, living out my best life creating snow angels in my backyard. in those days when it snowed heavy, the snow would come up to your knees (keep in mind i was 7). i remember the feeling well, being buttoned up head to toe, my immigrant parents putting me in wayyy more layers than were at all necessary. but given their unfamiliarity with the cold canadian winters, there was never less than 3 if not 4 layers under my jacket. it was a lot, but even still the snow would somehow sneak its way into my snowboots. and i would just have to keep walking, feeling the pellets of snow build up within my boot and in between my snow pants. those were the days. even now though, when the snow does come around i try to embrace it as much as i can. admittedly, it’s hard not to feel like the main character when you literally can’t see anyone else and you’re pushing through the winds like a superhero. combine that with some high energy music and suddenly you really are a superhero , complete with your own soundtrack. so yeah, the next time you see me grinning as i walk through the heavy snow, you’ll know why ;)"]},{"t":"in pursuit of greatness","d":"2025-11-29","c":"self","l":false,"p":["“im in pursuit of greatness and i know people don’t usually talk like that, but i want to be one of the greats.”","funny enough, i knew very little about timothee chalamet before this, outside of the infamous snl skit with pete davidson. but the quote above changed everything. anyone who knows me knows how much ive quoted him since then. its unfortunate, but being genuine about your ambition in our society for some reason gets read as arrogance, like youre doing too much. somewhere along the way we blurred the line between ambition and arrogance. we started treating being driven and excited about your goals as if it were bragging. a line was drawn, and it was drawn wrong. and honestly its tiring living in a world where people feel like they have to fake humble themselves every step of the way. it comes off as deeply inauthentic and, its just unhelpful. i truly believe society thrives when we are loud and ambitious about our goals. it creates a culture of striving for excellence instead of doing the bare minimum. moreover, i think there are important benefits to being loud. it impacts not just how the world sees you, but how you start seeing yourself as well. when you start telling the world what youre meant for, the world starts adjusting to that version of you. say nothing, and nothing shifts. none of this is new. historically, the only time you ever saw great things happen is when a person brave enough to challenge the status quo came along. and then everything changed. in the early 1950s for instance, people genuinely believed it was impossible to break the 4 minute mile. for over a decade, experts, coaches, and even doctors claimed the human body had biological limits that made it unachievable.","then roger bannister, a medical student, came along. he knew how ridiculous that belief was and set out to prove them wrong. and he did exactly that, running a mile in 3:59.4 in 1954. within months, more runners broke the record too. this barrier that had held for over a decade disappeared the moment someone showed it could be done. this is all to say that when we start embracing this culture of pushing limits and doing great things, we can actually bring those things to life. so yeah, if it wasn’t clear already, i want to be one of the greats. i want to spend the rest of my life creating things that matter, things that last, and hopefully stand the test of time. at least until another timothee or roger comes around and the standards are reset."]},{"t":"getting comfortable being bad at things","d":"2025-11-30","c":"how","l":false,"p":["like most people i’m not generally very comfortable being bad at things. in particular i get upset when i’m bad at something that, in-theory, i should be good at. in this case it would be writing. i read a decent amount, and i think i’m semi-good at articulating ideas via conversation. but something happens when i try to bring these words to paper. unfortunately, as a result of my discomfort with writing, i’ve often put it off. not that i haven’t done it at all. i‘ve written my fair-share of essays. but the process is usually done extremely last minute, either right at the deadline or often past it. as a result, i don’t think i’ve ever really given myself a fair shot at getting better at it. if the only time i’m writing is under extreme pressure, it makes sense that i’ve never had the opportunity to properly refine the skill. so this substack will be an opportunity to finally give this writing thing a fair shot. i’m also hoping this might be one of those killing two birds with one stone situations where i: get better at writing","practice doing things that are hard and make me uncomfortable consistently","so here’s to doing things you’re bad at, especially when they make you uncomfortable."]},{"t":"Media Literacy","d":"2025-12-01","c":"takes","l":false,"p":["In the past few years, I’ve seen an increasing number of people cite Instagram as their source when discussing current issues. This is extremely alarming. I first became wary of social media as a news source when I began seeing my high school peers rely on the massively popular, “Canadian News” Instagram account, 6ixbuzz. Because I did not use social media until later in high school, it was immediately obvious that their posts only had one goal: to attract likes and comments by posting the most divisive content possible. Captions such as “Do you think this is a W or L?” appeared regularly, even on posts that clearly required more context. What worried me most was that the people consuming this content were, by all accounts, intelligent. I went to a high school where more than 98 percent of students went on to university, yet even they seemed surprisingly susceptible to the misinformation that was so common on social media. Unfortunately, when I arrived at university, the problem did not improve. In many ways, it became worse. The same people who relied on social media for information in high school had only increased their dependence on it. With the rise of artificial intelligence, it now seems that many university students read only two kinds of material: the output of a LLM or social media posts that were likely generated by a LLM as well. I believe this problem will continue to worsen because, when given the choice, most people select the path of least resistance. It is far easier to scroll through short, east to comprehend posts, than to search for information independently and do the difficult work of understanding what we are actually reading. Moreover, as we rely more on social media and tools such as ChatGPT for information, our ability to process complex ideas will deteriorate. The brain functions like any other muscle. If we do not use it, it weakens. What makes this situation even more concerning is the lack of institutional action. Universities, for example, could do far more to ensure that students are not outsourcing their thinking to artificial intelligence. They could design assignments that require genuine critical engagement, such as more in-class work, more presentations, and more tasks that cannot easily be generated by a language model. Yet from the outside, it appears that many universities have also chosen the easiest path. More rigorous evaluation requires more time and effort. If the very institutions whose purpose is to promote critical thinking do not seem committed to reducing reliance on artificial intelligence, it becomes difficult to imagine how society as a whole can encourage people to seek information beyond social media and language models. I believe we are at a tipping point. If we do not make deliberate choices in the next few years to address this issue, the problem will only worsen. We may eventually reach a point where a significant portion of the population is unable to think critically. By then it may be too late, even for those who still can, because the majority of people participating in democratic processes may not be able to evaluate information on their own. The consequences of such a shift could be severe."]},{"t":"My Parents Son","d":"2025-12-02","c":"self","l":false,"p":["As the years go by it is starting to feel inevitable that I will one day become my parents. I say this in mostly a positive way, as in I’m grateful for the positive traits they passed down. However, what I do find funny about all of this is how much time I spent telling them I wanted to do the opposite of everything they told me to do. And yet now, 300km away from them, with the space to do literally whatever I want, I find myself doing things remarkably similar to my parents. One example of this is my dad, who has always been very entrepreneurial. Growing up, I saw him put an insane amount of hours into his businesses, and I vowed to myself that I wouldn’t go down this same route. After all, why would I choose a life of constant stress when I could work a cushy 9–5? Unfortunately, it seems that no matter how much I argued with my dad about the risks of entrepreneurship, I am now finding myself on that exact same pathway. Now I am dealing with two emotions: Extremely grateful to have great, loving parents, and to inherit some really positive traits from them.","But also this level of existential crisis, because if I’m just a result of my parents, then what makes me unique? What new thing did I actually bring to the table?","The compromise that I’ve come to internally for now is similar to the analogy of a deck of cards: life hands you a set, and it’s up to you how you play them. This realization has reinforced the idea that, at the end of the day, I might not be able to fully escape the person my parents raised me to be, but I can choose how to work with what I’ve been given. And just like me, everyone else grew up in a specific environment that shaped who they became, in both intentional and accidental ways. This is a helpful reminder that everyone is carrying their own mix of influences. Moreover it helps make the comparison game (a game I am all too familiar with) feel less useful, because we’re all playing different versions of life with different starting points and different rules. Anyways, now that I’ve figured this out, my next mission is to figure out how I can best play this hand and hopefully win the game of life (just finding inner peace tbh)."]},{"t":"energy distribution","d":"2025-12-03","c":"how","l":false,"p":["one of the lessons i’m slowly learning in adulthood is that not everything deserves the same amount of my energy. i most often find this being an issue with school, where i often find myself spending a lot of time on assignments that literally do not matter, spending way more time than necessary for a potentially 10% increase in grade. what’s frustrating is that i think i’m pretty effective when it comes to managing my own endeavours, whether it be a club or event i’m organizing. but something happens when school gets involved. something about that arbitrary 30 or 40% weight assigned to all those random assignments. you’d think that after a certain point i’d get desensitized to all of this and i’d start being able to actually get my priorities straight. but no, even in my 20th year of life, these numbers still seem to hold some sort of power over me. so what i’ve been really trying to practice over the last few months is the habit of literally just handing things in. more importantly, i’ve been trying to work on being more okay with accepting marks that are slightly lower than what i might be used to, while reminding myself that this lets me focus more on what i actually want to do. i believe this is one of those things that i’ll really only get over through greater exposure over time. regardless, i realize that this is something i’m still learning to do, and i’m sure there’s a careful balance to be found, but for now i’m gonna enjoy the extra hours i get to spend on things that actually make me excited."]},{"t":"the origin of self-doubt","d":"2025-12-04","c":"self","l":false,"p":["“I’m not a math person,” “I’m not an artist.” Perhaps some of the most destructive sentences that have ever been said out loud. Early on, so many of us grew up hearing teachers and adults around us create these labels for themselves, often with little validity to them. After all, how many of these people genuinely tried pursuing the things they claimed to be incapable of? But yet, sooner or later, many of us would find ourselves taking on these labels as well. And suddenly we were also not good at math, even though we all started off at the same level at one point in time. I’m not saying that everyone has to be an engineer or the next Van Gogh. But after struggling with something a couple of times, we start putting these labels on ourselves and avoid it altogether because we think, “What’s the point of doing this if I’m not good at it?” And then we rob ourselves of ever possibly getting to experience on all the good things that could’ve come with it because we never really gave it a real shot. The worst part about this is that this kind of sentiment just helps to exacerbate pre-existing gaps that may have already existed within a group of people. As in, you see your female teacher say “I’m not a math person,” or “I can’t do tech,” then suddenly there’s no surprise why there’s only 1 girl in your CS class of 25 people (this was in fact the actual gender ratio of my grade 11 CS class). And the same is often true with disciplines like literature or the arts as a whole. Many men are discouraged away from it or assume that they aren’t an artistic person because their male teacher struggled to draw a circle in class and therefore decided to claim, “I’m not an artist.” And so with all of this being said I think it is worth asking ourselves: What labels did I accept for myself? What doors did I shut? And is this something I can’t do, or something I just never really tried?"]},{"t":"living in the future","d":"2025-12-05","c":"self","l":false,"p":["Generally, I live life with very little regrets. You’ll rarely find me saying things like “I wish I had done more of this” or “I probably shouldn’t have done this.” I used to think that this was just the result of me being extremely content with every decision I’ve ever made. But then a mentor of mine helped frame it a bit differently for me. He offered the quote, “If you are depressed, you are living in the past. If you are anxious, you are living in the future.” He said that he wasn’t surprised that I never thought about the past, given how anxious I always seemed to be. He was right. I never thought about the past, not because I was so deeply content with it, but because there was no time to think about anything else when all I was worried about was my future. I am pleased to say, that this has improved significantly over the last few months. I think having the opportunity to work on projects that actually get me excited this past semester has allowed me to live in the present a lot more. This has, however, changed a bit in the last couple of days. In fact, I’d say a good majority of my time has been spent thinking about exactly what I’ll be doing four weeks from now. This time, though, I don’t think it’s coming from a place of anxiety. Instead, it’s coming from a place of excitement for all the crazy stuff I’m going to be able to do on exchange. Stuff like trying to figure out if I can legally rent a motorbike in Vietnam to complete the 400 km Ha Giang Loop solo.","While I probably should be more worried about exams right now, I can’t say that I’m not extremely happy and grateful to be in a position where I can spend so much time thinking about all the good things to come. subscribe!"]},{"t":"what is cool","d":"2025-12-06","c":"takes","l":false,"p":["i used to think doing improv was really stupid. afterall, it was the butt of so many jokes in sitcoms like the office, so why would i ever participate in this thing that everyone considered uncool? and honestly, until a little while back, the people doing improv didn’t match the idea of cool that i had convinced myself mattered. and so i just wrote the whole thing off without giving it a second thought. and then i met this guy. who happened to really be into improv, but he was also one of the smartest, most charismatic people i had ever met. he also happened to be a rhodes scholar and a lecturer at harvard, which, i’ll admit, probably played a role in how highly i thought of him. he also happened to be a tour guide. again, not the craziest job ever, but he did it at such an impressive level. and as someone who worked as a tour guide one summer, this guy completely blew all of my preconceived expectations out of the water. he was genuinely extremely enthusiastic and even created his own tours of the city purely because he cared so much. then i met his girlfriend, and she put into words what i had been struggling to figure out. how could this guy who does improv and is also a tour guide still somehow be so cool? and she said, “he has this ability to make anything he does cool, simply by caring a lot about it.”","and it hit me that anything i had ever deemed uncool was only uncool because i wasn’t confident enough to make it cool. since then, i’ve spent a lot of time re-evaluating what i actually want to do versus what i was avoiding just because i was scared other people would perceive me as less than. this led to the creation of a campus-wide hide-n-seek game. but first we dressed up in suits and walked around with paper bags on our heads with mr. beast’s face on them to advertise the game.","and then i got to do possibly one of the most fun things i’ve ever done, basically living out my mrbeast x squidgame dreams. where i had people running around campus and a digital fortnite-style storm closing in on hiders, plus side quests scattered throughout. all because i decided to care and embrace the uncool thing.","turns out that the only thing that ever made something uncool was just me not caring. once i fixed that, suddenly everything was on the table and i wasn’t scared of looking stupid anymore.","subscribe!"]},{"t":"the virtues of no","d":"2025-12-07","c":"how","l":false,"p":["one of the ways that i have dramatically improved the quality of my life has been by choosing to only pursue opportunities that excite me and saying no to literally everything else. this has allowed me to experience more life in the last 6 months than i had ever thought was possible. that is, by saying no more, i have experienced more life than when i was saying yes to everything. this is counterintuitive, i know. let me explain. to start, by saying no more often, it has forced me to properly evaluate exactly why i turn something down. was it because it truly did not interest me, or was i just scared to say yes? if fear was the reason, then i took that as a sign that i absolutely should go for it. it turns out there were many, many moments and opportunities that i was scared to say yes to. but what i did start rejecting were things that i realized i had only been pursuing because i was scared to say no. an example of this was saying no to returning to a previous summer job. it was a role that i knew would not provide growth in the way i wanted, and one i would have agreed to only because i was scared that i had no other options.","what i turned down when i chose not to go back to my old summer job instead, i chose to be unemployed. at the time, this was scary as hell since i’ve been working ever since i was 13 years old when i took my first job as a paper boy. but by saying no, i was able to experience a range of new experiences over the summer that allowed me to grow in far more ways than i ever could have imagined. in particular, it taught me one of the most important lessons i will ever learn: that i am fully capable of creating opportunities for myself. even without a pre-defined structure, i am still able to build and create in a way that supports my growth and allows me to contribute real value to this world. this year, i also said no to the default social option here on campus. this meant the typical going out on friday and saturday nights. unsurprisingly, these were never the most fulfilling experiences.","so, i decided to start running my own events on campus, like hosting dinners with people i thought were cool and wanted an excuse to actually get to know. this fortunately fed my soul in a way the usual routine never did.","now, at this current point in time, what i’m trying to figure out is what i want to do next summer. i know that i want an experience that pushes me to grow the same way last summer did, but i am unsure about the exact direction (whether this comes through an internship or something more entrepreneurial). what i do know is that i am not going to settle for the default path. i will keep saying no until an opportunity that genuinely excites me appears. and when it does, i will run towards it. subscribe!"]},{"t":"exams and sleep","d":"2025-12-08","c":"how","l":false,"p":["i’m writing this the night before the final exam for my econometrics course, worth 50–80% (the prof will reweight if the final exam grade is higher than the midterm). while usually i’m decently confident for exams, the average grade for the last final, according to my prof, was somewhere in the 50s. based on the midterm, where i only scored 2 points above the class average, i’m not feeling the most confident that i’ll be able to hit the required mark, which makes me worry if i’ll even do well enough to get a grade good enough (C) to meet the prerequisite requirement for a future course i need to graduate.","so now i’m at a point where i’m trying to figure out if i should go to sleep now or stay up for a bit longer and aim for 4.5 hours of sleep vs. my normal 6. however long i end up sleeping for ill find out this morning. as i think i’m just gonna head to sleep now. i think i’ll set my alarm for 4.5 hours, but i’ll probably end up sleeping closer to 6. hopefully it’s not more than that, and hopefully it doesn’t cost me the grade i need in this course. good night"]},{"t":"Introversion: the greatest lie you were ever told","d":"2025-12-09","c":"self","l":false,"p":["im generally a pretty consistently happy person.","and i think at least part of this happiness can be credited to my extrovertedness. i am definitely about as extroverted as they come. i love talking to new people, and i get energized by being around others as opposed to being alone. unfortunately, my grades have ocasionally paid the price for all the times i decided to yap instead of doing work. but regardless, outside of maybe some school work, my extroversion brings me a lot of happiness. until recently, i assumed this extroversion was something completely innate within me or, just as likely, the result of how i grew up. either way, i saw my extroversion as something out of my control, and because of that, i assumed introvertedness was also something people couldn’t really change. so i came to believe that the benefits of being extroverted were really only available to people who were either born extroverted or raised in a way that encouraged it. THAT IS, until i came across a tiktok a couple weeks ago that offered some new information. the video explained that a significant amount of research shows introverts who pretend to be extroverts experience a number of positive benefits, including higher mood, more energy, and greater confidence. interestingly, the research also found the reverse: when extroverts pretended to be introverts for a while, they ended up feeling worse afterward. and while you might expect introverts to feel drained from acting extroverted, the studies showed that those negative effects were generally minimal. overall, these studies suggested that people tend to do better when they take on extroverted traits.","this makes sense. human beings are innately social creatures. our survival has always depended on our ability to communicate and cooperate. the social structures we have built are the reason humanity has progressed so quickly. even though we are not the strongest, fastest, or “best” by any physical metric, our capacity to form social bonds is what allowed us to dominate the food chain. it is why our ancestors survived extreme climates and deadly predators. unfortunately, the mainstreaming of personality labels has made people think seclusion is normal. i want to be clear: i am not talking about introverts who just prefer alone time or smaller groups. that is obviously normal.","what is not normal is going to school or work every day and having almost no interaction outside what is required. the worst part is that so many people accept these labels for themselves and start living out these self fulfilling prophecy lives. and ofc social media has only made this worse. as more people normalize extreme introversion to themselves, they start to isolate even more. but because humans still need interaction, they turn to social media or video games instead.","unfortunately, what many people do not realize is that our brains do not treat viewing people online the same as interacting with them in real life. even online multiplayer games fall significantly short of what real human interaction provides. the thing is, when you are with someone in real life, there is so much more happening than just talking. studies show that over 70 percent of communication is non verbal, through things like body language, tone, and even chemical signals our bodies give off that others process unconsciously. ultimately, this is all to say that humans are incredibly social creatures. our survival literally depends on our ability to connect. but the rise of personality labels has pushed more people to self identify as introverts in extreme ways, leading to self fulfilling isolation. and while preferring some alone time is completely normal, the extremes we are stretching the definition of introversion to are not.","image sources https://disney.fandom.com/wiki/Olaf","https://www.history.com/articles/hunter-gatherers"]},{"t":"biases","d":"2025-12-10","c":"takes","l":false,"p":["as humans we are naturally prone to have biases. after all, this allows us to create helpful heuristics which let us move through life a lot quicker than having to individually evaluate everything situation that comes our way. unfortunately, what can often happen is that we start generalizing based off previous experiences, even when those experiences are not applicable to the current scenario. my econometrics class introduces one way to combat this. in class we studied an issue known as multi-collinearity. this happens when you are creating a model to estimate something, but some of your input variables are highly correlated. correction: house prices should be on the y-axis and total acreage should be on the x-axis. for instance, lets say we have a model looking at house prices and included variables such as total acreage of land and square footage of the house. because these two variables tend to move together, the model has a difficult time figuring out the separate effect of each one. what then happens is that the model can no longer confidently tell which variable is actually influencing the outcome, since both variables contain similar information. statisticians address this by collecting more varied data. when the dataset includes properties that break the usual pattern, the model can better distinguish the independent effect of each variable. with more diverse examples, the estimates become more stable and more meaningful. similarly, i believe the best way we can create better models for ourselves is by introducing more data and information to our own thinking. when we have more info and more reference points to work with, we are less likely to make judgments that are incorrect. more broadly, i think this has wider applications for discussions of teaching DEI in schools. by introducing more information through diversity initiatives, we are not mindwashing kids; we are simply giving them more info about the different ways this world works. with the goal that these kids can hopefully grow into adults who approach the world with greater compassion and empathy."]},{"t":"when canadians could build: the canadian pacific railway","d":"2025-12-11","c":"takes","l":false,"p":["this a new series that im gonna be writing to remind myself that there was once a time when canadians could build. this is partly my way of coping with whatever construction disaster we’re living through at the moment (looking at you finch and eglinton lrt). why was it built? the pacific railway was primarily built so that we could bring BC into the confederation. at the time BC was independent and stated that it would only join if we built a railway connecting it with the rest of the country.","so that we didn’t become america. at the time the americans openly believed that the canadian west would just naturally fall into the hands of the americans, and john a macdonald saw the railway as being an essential way to prevent american expansion.","facts to help you realize just how insane of a project this was the train was built when we only had a population of 3.5 million people. thats right, we built the longest railway that had ever been constructed at the time with only 3.5 million people living in the country. for some context the states had about 40 million people at the time and our railway ended up being 1000 miles longer than theirs.","we actually had no idea what much of the pacific coast even looked like. this is because at the time much of BC’s interior had yet to be explored, so we literally decided to build a train across the country without even having an idea of what we were going to be building it through.","we built the entire railway in 4 years, all 4860 km of it in 4 YEARS. keep in mind we had to run this through the canadian shield as well as the rocky mountains. the US, which had a far easier project, still struggled to barely complete their cross country railway in under 10 years.","the impact of this train: national unity! at the time canadian patriotism was at an all time low, and many people were even emigrating out of the country. building this railway gave us a renewed sense of pride, it proved to canadians at the time that they were capable of being a unified nation.","this summer i got to experience the train all the way from vancouver to toronto, and all i could think about was just how unbelievable this project really was. unless you’ve actually ridden the train, it’s almost impossible to understand how many ridiculous downright impossible places the route has to cross just to make its way across the country. if you ever get the chance, i’d highly recommend taking it, especially if another discount like the canada strong pass comes around. that pass actually let me do the entire trip for about $1000, food included, with an actual bed to sleep on. here are some pictures:","i hope this serves as a reminder that there was a time when we took on impossible projects and actually pulled them off, and that if we could do it once we can ABSOLUTELY DO IT AGAIN!"]},{"t":"why i choose to be loud","d":"2025-12-12","c":"self","l":false,"p":["for a long time, I associated being loud about my work, on social media or even in real life, with things people didn’t really care about. it felt less like sharing and more like showing off.","one of the reasons i felt negatively about it was because my first exposure to people being loud about their work was on linkedin. the issue with a lot of linkedin is that people often share exaggerated or performative accomplishments that do not actually mean much to them and are often posted purely for the employer gaze. since then, however, i’ve met some wonderful people who have introduced me to a new way of using linkedin and being loud in general. i’ve learned that there are other ways to use the platform(and others like it) that are less obnoxious and can actually be quite beneficial to the world. here are some ways to do this, along with other benefits of posting: 1. if you write genuinely (from the heart), people can feel it. this is the kind of stuff that gets people excited because they can relate to that pride and enjoy seeing others pursue things that truly matter to them. these are the kinds of accomplishments people love to support. one way i think you can help ensure people are able to spot this genuineness is by sharing what you learned throughout the experience. this signals to the reader that it is something that actually means a lot to you. more importantly, it removes the feeling that you are just showing off and lets you be confident that you are providing real value to others. 2. there are immense, serendipitous benefits to being loud on the internet. at the end of the day, the internet is the ultimate connector. being strategic about how you explain your goals online can often lead to excellent conversations. people are much more willing to help than you might expect. especially if it seems like you are actively working toward a goal and sharing proof of progress along the way. it then becomes much easier for others to engage and offer guidance. as a kid who did not grow up on the internet, this was huge. 3. the final benefit of being loud, and perhaps the most important one, is that you can inspire others to do cool stuff too. this is very much a win win situation because if people around you start doing more cool things after being inspired by you, it becomes extra motivation for you to keep creating as well. this can even lead to the formation of communities centered around what you love doing. it really is that easy. as someone who cares deeply about making sure that everyone around me is successful in life, being loud allows me to be a model for my peers. more importantly, when i share what i learned throughout the process, it shows others that i am also just figuring it out and that they are just as capable of doing what i did, if not more. so for those of you who have hesitated to post about your work online, i urge you to share something you worked on recently that excited you, if not for yourself, then for your peers and your community."]},{"t":"tending my garden","d":"2025-12-14","c":"how","l":false,"p":["one thing i’ve never been good at is doing the hard thing for a long, consistent time. one reason for this, i think, is partly due to how i manage my time. i like to say that i aggressively optimize my time by doing things that allow me to get maximum return on time. unfortunately, this means that in many circumstances, it doesn’t make sense to do things more than a few times. this is because, in most cases, the vast majority of gains come early on. for instance, something i started doing this semester was hosting curated dinners. but after just a couple of times hosting, i began to seek out bigger and more “ambitious” things. unfortunately, the issue with this is that i often end up giving up far before i can see the full potential benefit, which can only come about through the marginal gains that come from getting in many reps. i want to fix that though. and with the semester now ending and 2026 soon ahead of us, one of my goals is to do more hard things, consistently. this substack is definitely one of those things. but where i think the real gains are to be made, and where true discipline will be built, is in doing the hard thing that doesn’t offer an immediate reward. something that doesn’t come with some level of public accountability, like this substack. hopefull y this will be the gym."]},{"t":"beef curry","d":"2025-12-15","c":"places","l":false,"p":["here’s a funny story. after i started university i began to grow this level of distrust around my parents cooking. not because it wasn’t good, if anything, that was the problem. for some context i grew up in a joint-household, living with my uncle’s family. my grandmother also lived with us and because she was bed-bound for the last few years of her life, most family gatherings ended up happening at our place. given the fact that my dad had 8 siblings, and 5 of them lived nearby, we would often have some pretty big family gatherings. combine that with my dads cousins, who were also a sibling set of about 5, each with their own families, and gatherings of 50 to 60+ were a pretty normal occurrence in my house. this is all to say there was always a lot of food going around my house. and it was all insanely good, rich, and indulgent. and for most of my life i didn’t think twice about this. i just showed up and there was always something good in the fridge. plates refilled themselves. that is, until i started university. and while at first i absolutely despised the food at university, i slowly began to realize something else was happening. that eating food that was lighter, less oily, left me feeling better, more awake. more in control of my body. this was of course huge. this really started to hit when i realized the reason why i used to always feel so tired at home was because of the many carb-heavy and generally rich dishes i was eating. to be fair, there were most definitely other options. there were lighter, vegetable-heavy or fish-based dishes that were definitely healthy, but unfortunately by that point i started to just generalize it all. anything home cooked could not have been good for me. after that, whenever i came home i chose to instead eat the “healthy” foods that i learned to eat at university. the salads, the smoothie bowls, the baked chicken, you know the drill. i remember coming home a few times and even being annoyed at my parents when there was nothing “healthy” in the fridge to eat, even though there were at least 5 to 6 incredible dishes at any one time that i could choose from. i know, what a privileged take. something changed recently though. tonight, for the first time in two and a half years returning back after the end of the semester, i ate my family’s beef curry. late at night too, which would’ve been unthinkable for me a year ago. i did this, partly because i couldn’t help myself. but also partly because i know that in two weeks, i’ll be gone for four months, and then there won’t be any home cooked meals for a while. the beef curry in question. growing up in a big family everything was cooked in these huge pots. and sure, i’ll eat well in singapore. i know that. but i also know none of it will taste like this, not because it’s better, but because it belongs to a place and a time that doesn’t travel with me. and somewhere in all of this i’m also slowly coming to the realization that i’ve spent about 90% of the time i will ever spend with my parents already. not talking about the big moments. but the ones where im just sitting at a table having dinner with them, or the late night conversations i’d end up getting into with my mom. the ones that usually started with me going to the kitchen for dinner, but ended with us talking late into the night. so sure, maybe next time i eat another of my mom’s beef curries, i’ll feel a little groggier in the morning. but i think i’ve got a whole life ahead of me to eat salads. for now, i’ll enjoy all the beef curry i can get, while i still can."]},{"t":"spotify wrapped and the genius behind it","d":"2025-12-18","c":"takes","l":false,"p":["spotify wrapped came out a few weeks ago and like many of you im still tryna figure out how drake is so high up there (there is no way this man is my number 2). still, i was super excited to see my spotify wrapped come out this year, which feels crazy to say given the fact that wrapped is literally a marketing campaign. in that regard, i believe wrapped may just be the most successful marketing campaign in history, solely based on the number of people who genuinely look forward to it and don’t treat it like just another marketing ploy. but what makes it so successful? how does a marketing-savvy brown man, who was basically born calling out ads, still get so excited by it. i decided to do some research and here’s what i found: 1. its all about the numbers for most of us, the music we listen to shapes how we see ourselves. the numbers spotify provides turn that feeling into something concrete and measurable. moreover, in a world where people are becoming increasingly paranoid about how much data is being collected about them, spotify manages to present this data in a way that doesn’t feel invasive. instead of making us feel tracked, it packages the information in such a pleasant and personalized way that we’re actually excited to share it with our friends. 2. comparison theory if there’s anything humans love to do, its comparing ourselves. spotify makes this extremely easy by telling you exactly where you stand compared to everyone else. usually being in the top 2% of anything feels good, so finding out you’re in the top 2% of listeners to an artist you love feels even better. 3. the ultimate ugc they say the best ugc is the kind you can’t even tell is ugc. so what does it mean when people are actively advertising your platform with a sense of pride? it means you’ve cracked the ugc code. this is why you’re seeing so many copy cats. spotify wrapped is one of the few examples of people being genuinely excited to advertise a company, without really realizing they’re doing it, which is what makes this so genius. spotify achieves this by conveniently making all of the spotify wrapped slides in instagram story format, making them perfect for quick sharing across instagram and other social media platforms. 4. being perceived like all humans, we have a deep need to feel seen. and for many of us, our music taste is deeply tied to who we are. unfortunately, as a society, we’re not always the friendliest toward people who overshare. sharing hyper-specific stats about your music taste, even if you’re proud of them, wouldn’t usually be considered very cool in a normal setting. what spotify has done so well is normalize the act of sharing your music taste and listening habits. by introducing concepts like listening age and music club, it gives people a socially acceptable way to share something personal about themselves. in short, spotify figured out some of the things humans love most and found a way to directly integrate them into a marketing experience that doesn’t feel like marketing at all. everything mentioned in this article was heavily sourced from the articles below: https://irrationallabs.com/blog/spotify-wrapped-behavioral-science/ https://thedecisionlab.com/insights/consumer-insights/the-behavioral-science-behind-spotify-wra ppeds-viral-success?utm_source=chatgpt.com finally, apologies for the lack of posts in the last few days. was sick, but will hopefully be more consistent going forward :) oh and also here’s my wrapped!"]},{"t":"why news is dead","d":"2025-12-20","c":"takes","l":false,"p":["In our extremely politically divided world, blame is often placed on news corporations for pushing out divisive narratives. While many argue that we need more neutral media, I believe that neutrality is no longer something we can reasonably expect from these corporations. We now live in an increasingly algorithm-driven media environment, where content that people engage with most is what tends to spread and succeed. As a result, companies are incentivized to create narratives that generate these reactions, even when it comes at the cost of accuracy. At the end of the day, as much as we might deny it, we prefer media that carries opinions with it. More specifically, we tend to favor opinions that already align with our preconceived notions. The only reason neutral media worked in the pre social media world is because networks had to align themselves with as many people as possible in order to maximize viewership. In a world with unlimited options for consuming media, companies must choose a direction and stick to it. Otherwise, people will gravitate toward sources that are more aligned with what they already believe. It is sad to say, but if you are truly in search of neutral and accurate reporting today, your best bet is to stop looking for it in one place. The only way to get closer to the truth is to compare narratives across different media, recognize their biases, and decide for yourself what actually makes sense."]},{"t":"Defining 2025: Belief Capital","d":"2025-12-21","c":"self","l":false,"p":["Belief capital is the idea that people are capable of far more than they realize, and that sometimes all it takes is someone else believing in them to bring what’s possible within reach. A friend and mentor introduced me to this term just yesterday, but in many ways, I think it best encapsulates my 2025. 2025 was the year that more people put their belief behind me than ever before. At nearly every step of the way, through every new thing I tried, they
